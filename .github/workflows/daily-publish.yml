name: Daily Project Passport Social Publishing (Composio)

on:
  schedule:
    # 8:00 PM IST (UTC+5:30) is 14:30 UTC
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      publish_date:
        description: 'Target post date in YYYY-MM-DD format (leave blank for today IST)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish to LinkedIn & X
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Composio Social Media Publisher
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          PUBLISH_DATE: ${{ inputs.publish_date }}
        run: |
          node marketing/automation/publish.mjs

      - name: Commit & Push Publishing Logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketing/daily-posts/ marketing/publishing-log/
          if git diff --staged --quiet; then
            echo "No changes to commit (posts already published or skipped)."
          else
            git commit -m "chore(marketing): record publishing status [skip ci]"
            git push
          fi
